<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark blackboard background, rounded corners -->
  <rect width="64" height="64" fill="#09090b" rx="10"/>

  <!-- Floating waveform above the head — audio brain at work -->
  <path d="M 14 12 Q 18 6 22 12 T 30 12 T 38 12 T 46 12 T 50 12"
        fill="none"
        stroke="#22d3ee"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Bald head — chalk-white circle -->
  <circle cx="32" cy="29" r="11"
          fill="none"
          stroke="#f4f4f5"
          stroke-width="2.5"/>

  <!-- Shoulders / bust — chalk-white curve -->
  <path d="M 12 60 Q 12 42 32 42 Q 52 42 52 60"
        fill="none"
        stroke="#f4f4f5"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
